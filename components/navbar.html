<script>

function toggleTrustLensMenu() {

    const menu =
        document.getElementById("trustlens-menu");

    const button =
        document.querySelector(".mobile-menu-button");

    menu.classList.toggle("mobile-menu-open");

    if (menu.classList.contains("mobile-menu-open")) {

        button.innerHTML = "✕";

    } else {

        button.innerHTML = "☰";

    }

}

</script>
