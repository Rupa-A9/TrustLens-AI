<style>
/* =========================================================
   TRUSTLENS AI - RESPONSIVE NAVBAR
   ========================================================= */

.tl-navbar {
    width: 100%;
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-sizing: border-box;

    padding: 0 24px;
    margin-bottom: 28px;

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.10);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    position: relative;
    z-index: 9999;
}


/* =========================================================
   BRAND
   ========================================================= */

.tl-navbar-brand {
    display: flex;
    align-items: center;

    gap: 12px;

    white-space: nowrap;
}

.tl-brand-name {
    color: #ffffff;

    font-size: 21px;
    font-weight: 800;

    letter-spacing: -0.4px;
}

.tl-brand-divider {
    color: rgba(255, 255, 255, 0.25);

    font-size: 18px;
}

.tl-brand-subtitle {
    color: #64748b;

    font-size: 12px;
}


/* =========================================================
   DESKTOP NAVIGATION
   ========================================================= */

.tl-desktop-nav {
    display: flex;

    align-items: center;

    gap: 6px;
}

.tl-nav-link {
    display: flex;

    align-items: center;
    justify-content: center;

    padding: 9px 14px;

    border-radius: 10px;

    color: #cbd5e1 !important;

    text-decoration: none !important;

    font-size: 13px;
    font-weight: 600;

    white-space: nowrap;

    border: 1px solid transparent;

    transition: all 0.2s ease;
}

.tl-nav-link:hover {
    color: #ffffff !important;

    background: rgba(37, 99, 235, 0.18);

    border-color: rgba(96, 165, 250, 0.25);

    transform: translateY(-1px);
}


/* =========================================================
   MOBILE MENU BUTTON
   ========================================================= */

.tl-menu-toggle {
    display: none;

    width: 54px;
    height: 54px;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: rgba(37, 99, 235, 0.22);

    border: 1px solid rgba(96, 165, 250, 0.35);

    cursor: pointer;

    box-sizing: border-box;
}


/* Hide checkbox */
.tl-menu-checkbox {
    display: none;
}


/* Hamburger */
.tl-hamburger {
    width: 28px;
    height: 22px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.tl-hamburger span {
    display: block;

    width: 100%;
    height: 4px;

    border-radius: 5px;

    background: #ffffff;

    transition: all 0.2s ease;
}


/* =========================================================
   MOBILE DROPDOWN
   ========================================================= */

.tl-mobile-menu {
    display: none;

    position: absolute;

    top: calc(100% + 8px);

    right: 12px;

    width: 245px;

    padding: 10px;

    box-sizing: border-box;

    border-radius: 16px;

    background: #111827;

    border: 1px solid rgba(96, 165, 250, 0.35);

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.55);

    z-index: 10000;
}


.tl-mobile-link {
    display: flex;

    align-items: center;

    width: 100%;

    min-height: 54px;

    padding: 0 22px;

    margin-bottom: 8px;

    box-sizing: border-box;

    border-radius: 12px;

    background: #2563eb;

    border: 1px solid #3b82f6;

    color: #ffffff !important;

    text-decoration: none !important;

    font-size: 16px;

    font-weight: 700;

    transition: all 0.2s ease;
}


.tl-mobile-link:last-child {
    margin-bottom: 0;
}


.tl-mobile-link:hover {
    background: #2563eb;

    border-color: #60a5fa;

    color: #ffffff !important;

    box-shadow:
        0 6px 18px rgba(37, 99, 235, 0.30);
}


/* =========================================================
   OPEN MOBILE MENU
   ========================================================= */

.tl-menu-checkbox:checked ~ .tl-mobile-menu {
    display: block;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 850px) {

    .tl-navbar {
        min-height: 72px;

        padding: 0 16px;

        margin-bottom: 25px;
    }


    .tl-brand-subtitle,
    .tl-brand-divider {
        display: none;
    }


    .tl-brand-name {
        font-size: 20px;
    }


    /* Hide desktop navigation */
    .tl-desktop-nav {
        display: none;
    }


    /* Show hamburger */
    .tl-menu-toggle {
        display: flex;
    }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 450px) {

    .tl-navbar {
        padding: 0 14px;
    }


    .tl-brand-name {
        font-size: 19px;
    }


    .tl-mobile-menu {
        right: 8px;

        width: calc(100vw - 40px);

        max-width: 300px;
    }

}
</style>


<div class="tl-navbar">

    <!-- BRAND -->

    <div class="tl-navbar-brand">

        <span class="tl-brand-name">
            🛡️ TrustLens AI
        </span>

        <span class="tl-brand-divider">
            |
        </span>

        <span class="tl-brand-subtitle">
            AI Fake Review Detection
        </span>

    </div>


    <!-- DESKTOP NAVIGATION -->

    <div class="tl-desktop-nav">

        <a
            class="tl-nav-link"
            href="/?page=detect"
        >
            Detect
        </a>

        <a
            class="tl-nav-link"
            href="/?page=batch"
        >
            Batch
        </a>

        <a
            class="tl-nav-link"
            href="/?page=dashboard"
        >
            Dashboard
        </a>

        <a
            class="tl-nav-link"
            href="/?page=insights"
        >
            Insights
        </a>

    </div>


    <!-- MOBILE CHECKBOX -->

    <input
        type="checkbox"
        id="tl-menu-checkbox"
        class="tl-menu-checkbox"
    >


    <!-- HAMBURGER -->

    <label
        for="tl-menu-checkbox"
        class="tl-menu-toggle"
    >

        <span class="tl-hamburger">

            <span></span>
            <span></span>
            <span></span>

        </span>

    </label>


    <!-- MOBILE MENU -->

    <div class="tl-mobile-menu">

        <a
            class="tl-mobile-link"
            href="/?page=detect"
        >
            Detect
        </a>

        <a
            class="tl-mobile-link"
            href="/?page=batch"
        >
            Batch
        </a>

        <a
            class="tl-mobile-link"
            href="/?page=dashboard"
        >
            Dashboard
        </a>

        <a
            class="tl-mobile-link"
            href="/?page=insights"
        >
            Insights
        </a>

    </div>

</div>
